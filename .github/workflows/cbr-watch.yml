name: CBR USD/EUR watcher

on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 3 часа (UTC): 00,03,06,09,12,15,18,21
  workflow_dispatch:
    inputs:
      force_send:
        description: "Отправить текущие курсы в MAX принудительно (тест)"
        type: boolean
        default: false

permissions:
  contents: write   # нужно, чтобы коммитить state.json

concurrency:
  group: cbr-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check rates and notify MAX
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: python scripts/check_rates.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "rates: update USD/EUR state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "state.json не изменился — коммит не нужен"
          fi
