name: Get MAX chat id

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show chat ids from bot updates
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: python scripts/get_chat_id.py
